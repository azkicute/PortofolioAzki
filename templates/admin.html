{% extends "admin_base.html" %}
{% block judul %}Kelola proyek{% endblock %}
{% block isi %}
  <h1 class="admin-title">Kelola proyek</h1>
  <a class="btn" href="{{ url_for('tambah') }}">+ Tambah proyek</a>

  <div class="tabel-wrap">
    <table class="tabel">
      <thead>
        <tr><th>Ikon</th><th>Judul</th><th>Tag</th><th>Aksi</th></tr>
      </thead>
      <tbody>
        {% for x in daftar %}
        <tr>
          <td>{{ x.ikon }}</td>
          <td>{{ x.judul }}</td>
          <td>{{ x.tag }}</td>
          <td class="aksi">
            <a class="btn kecil alt" href="{{ url_for('edit', proyek_id=x.id) }}">Edit</a>
            <form method="post" action="{{ url_for('hapus', proyek_id=x.id) }}"
                  onsubmit="return confirm('Hapus proyek ini?')">
              <button class="btn kecil bahaya" type="submit">Hapus</button>
            </form>
          </td>
        </tr>
        {% else %}
        <tr><td colspan="4">Belum ada proyek.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
{% endblock %}
